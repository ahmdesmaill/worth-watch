<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Worth Watch 🍿</title>

        <!-- Inter google font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="./styles.css" />
        <script defer src="./index.js"></script>
    </head>
    <body>
        <header>
            <h1>Find your film</h1>
            <a href="./watchlist.html">My Watchlist</a>
        </header>
        <main>
            <div id="search-component">
                <div id="search-input-container">
                    <img id="search-icon" src="./icons/search.png" alt="" />
                    <input
                        id="search-input"
                        type="search"
                        placeholder="Search for a movie"
                        aria-label="Enter movie title"
                    />
                </div>
                <button id="search-button" type="button">Search</button>
            </div>
            <ul id="movies-ul"></ul>
            <button id="show-more-button">Show more</button>
            <div id="empty-placeholder-container">
                <img id="strip-icon" alt="" src="./icons/film-strip.png" />
                <p id="empty-placeholder-title">Start exploring</p>
            </div>
        </main>
        <div id="spinner-bg">
            <div id="spinner">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="20" />
                </svg>
            </div>
        </div>
    </body>
</html>
